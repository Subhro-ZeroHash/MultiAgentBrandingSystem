server {
    server_name api.3-24-200-83.sslip.io;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Publishing a Reel blocks on Instagram finishing its own video
        # processing: social.service.ts polls for up to 120s
        # (REEL_CONTAINER_POLL_ATTEMPTS x REEL_CONTAINER_POLL_INTERVAL_MS)
        # before giving up. nginx's 60s default cut that in half and surfaced
        # as a 504 in the app while the post was still in flight. 180s leaves
        # headroom above the application's own ceiling, which stays the real
        # limit on how long a publish may take.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        # A Reel upload carries a whole video through this proxy.
        client_max_body_size 200m;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.3-24-200-83.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.3-24-200-83.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = api.3-24-200-83.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.3-24-200-83.sslip.io;
    return 404; # managed by Certbot
}
