# nginx reverse-proxy config for the BMAS production box.
#
# Deploy instructions
# -------------------
#   sudo cp nginx/bmas.conf /etc/nginx/sites-available/bmas
#   sudo ln -sf /etc/nginx/sites-available/bmas /etc/nginx/sites-enabled/bmas
#   sudo nginx -t && sudo systemctl reload nginx
#
# All four Node services are managed by PM2 (see ecosystem.config.cjs).
# nginx sits in front and handles TLS termination + the timeouts below.

# ── Reel / video upload timeouts ────────────────────────────────────────────
# Meta transcodes video server-side after the container is created.  The API
# polls for FINISHED status for up to 40 × 3 s = 120 s before giving up.
# nginx's default proxy_read_timeout is 60 s, which cuts the connection in half
# that window and returns a 504 to the mobile client.  150 s is the ceiling for
# that window with a 30 s buffer for the final publish Graph API call.
# ────────────────────────────────────────────────────────────────────────────

upstream content_api {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream geo_api {
    server 127.0.0.1:3002;
    keepalive 16;
}

upstream web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ── HTTP → HTTPS redirect ───────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── HTTPS ───────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name _;  # Replace with your actual domain

    # TLS — update these paths to your actual certificate location
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ── content-api (/api/*) ────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://content_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Default timeouts for normal API calls (image posting, etc.)
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     60s;
    }

    # ── Reel / video posting — extended read timeout ─────────────────────────
    # The /api/social/post-reel endpoint polls Instagram for up to 120 s while
    # Meta transcodes the video.  nginx's 60 s default would return a 504 to
    # the mobile client before the poll finishes.  150 s gives the full 120 s
    # poll window plus a 30 s buffer for the publish call that follows.
    location /api/social/post-reel {
        proxy_pass         http://content_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout    150s;   # 120 s poll ceiling + 30 s publish buffer
    }

    # ── geo-api ─────────────────────────────────────────────────────────────
    location /geo-api/ {
        proxy_pass         http://geo_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     60s;
    }

    # ── Next.js web app (everything else) ───────────────────────────────────
    location / {
        proxy_pass         http://web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     60s;
    }
}
